<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <style>
      .hovas-circle { fill: white; stroke: #000; stroke-width: 2; }
      .hovas-wing { fill: #dc143c; stroke: #001a4d; stroke-width: 1.5; }
      .hovas-wing-stripe { fill: #001a4d; }
      .hovas-body { fill: #dc143c; stroke: #001a4d; stroke-width: 1.5; }
      .hovas-head { fill: white; stroke: #001a4d; stroke-width: 1.5; }
      .hovas-text { font-family: Arial, sans-serif; font-weight: bold; fill: #001a4d; text-anchor: middle; }
      .hovas-title { font-size: 24px; letter-spacing: 2px; }
      .hovas-sub { font-size: 18px; }
    </style>
  </defs>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="95" class="hovas-circle"/>
  
  <!-- Left wing -->
  <path d="M 70 100 Q 50 90 35 75 Q 30 70 28 80 Q 40 95 60 105" class="hovas-wing"/>
  <path d="M 65 95 Q 48 88 38 75 Q 35 72 34 80 Q 48 92 65 100" class="hovas-wing"/>
  <path d="M 60 105 Q 45 100 38 88 Q 36 85 36 92 Q 48 105 60 110" class="hovas-wing"/>
  
  <!-- Right wing -->
  <path d="M 130 100 Q 150 90 165 75 Q 170 70 172 80 Q 160 95 140 105" class="hovas-wing"/>
  <path d="M 135 95 Q 152 88 162 75 Q 165 72 166 80 Q 152 92 135 100" class="hovas-wing"/>
  <path d="M 140 105 Q 155 100 162 88 Q 164 85 164 92 Q 152 105 140 110" class="hovas-wing"/>
  
  <!-- Eagle body -->
  <ellipse cx="100" cy="95" rx="12" ry="18" class="hovas-body"/>
  
  <!-- Eagle head -->
  <circle cx="100" cy="75" r="8" class="hovas-head"/>
  
  <!-- Text -->
  <text x="100" y="155" class="hovas-text hovas-title">HOVÅS</text>
  <text x="100" y="185" class="hovas-text hovas-sub">HC</text>
</svg>