  <!-- Eagle wings - left side -->
  <path d="M 70 100 Q 65 85 60 75 Q 58 70 55 75 Q 60 85 65 95" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  <path d="M 65 95 Q 60 90 55 80 Q 53 75 50 82 Q 55 92 60 100" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  <path d="M 60 100 Q 55 95 50 85 Q 48 80 45 88 Q 50 98 55 105" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  
