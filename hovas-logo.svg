<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <defs>
    <style>
      .wing { fill: #dc143c; stroke: #000; stroke-width: 1.5; }
      .wing-stripe { fill: #001a4d; stroke: none; }
      .body { fill: #dc143c; stroke: #000; stroke-width: 2; }
      .head { fill: white; stroke: #000; stroke-width: 2; }
      .circle { fill: white; stroke: #000; stroke-width: 2; }
      .text-main { font-family: Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #001a4d; text-anchor: middle; letter-spacing: 3px; }
      .text-sub { font-family: Arial, sans-serif; font-size: 36px; font-weight: bold; fill: #001a4d; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Bottom circle -->
  <circle cx="150" cy="150" r="135" class="circle"/>
  
  <!-- Left wing - outer feathers (red) -->
  <path d="M 80 120 Q 50 110 30 100 Q 20 95 25 105 Q 50 120 75 130" class="wing"/>
  <path d="M 75 130 Q 50 125 32 118 Q 22 114 28 125 Q 55 138 75 145" class="wing"/>
  <path d="M 75 145 Q 50 140 32 135 Q 22 131 28 142 Q 55 155 75 160" class="wing"/>
  <path d="M 80 160 Q 55 155 35 152 Q 25 150 30 160 Q 58 172 80 175" class="wing"/>
  
  <!-- Left wing - inner stripes (blue) -->
  <path d="M 85 125 Q 65 118 48 112 Q 42 110 45 118 Q 65 128 85 135" class="wing-stripe"/>
  <path d="M 85 140 Q 65 133 48 128 Q 42 126 45 134 Q 65 143 85 150" class="wing-stripe"/>
  <path d="M 85 155 Q 65 148 48 144 Q 42 142 45 150 Q 65 158 85 165" class="wing-stripe"/>
  
  <!-- Right wing - outer feathers (red) -->
  <path d="M 220 120 Q 250 110 270 100 Q 280 95 275 105 Q 250 120 225 130" class="wing"/>
  <path d="M 225 130 Q 250 125 268 118 Q 278 114 272 125 Q 245 138 225 145" class="wing"/>
  <path d="M 225 145 Q 250 140 268 135 Q 278 131 272 142 Q 245 155 225 160" class="wing"/>
  <path d="M 220 160 Q 245 155 265 152 Q 275 150 270 160 Q 242 172 220 175" class="wing"/>
  
  <!-- Right wing - inner stripes (blue) -->
  <path d="M 215 125 Q 235 118 252 112 Q 258 110 255 118 Q 235 128 215 135" class="wing-stripe"/>
  <path d="M 215 140 Q 235 133 252 128 Q 258 126 255 134 Q 235 143 215 150" class="wing-stripe"/>
  <path d="M 215 155 Q 235 148 252 144 Q 258 142 255 150 Q 235 158 215 165" class="wing-stripe"/>
  
  <!-- Eagle body (red) -->
  <ellipse cx="150" cy="115" rx="28" ry="35" class="body"/>
  
  <!-- Eagle head (white) -->
  <circle cx="150" cy="85" r="12" class="head"/>
  
  <!-- Head details -->
  <circle cx="153" cy="83" r="3" fill="#000"/>
  
  <!-- Text HOVÅS -->
  <text x="150" y="125" class="text-main">HOVÅS</text>
  
  <!-- Text HC -->
  <text x="150" y="260" class="text-sub">HC</text>
</svg>