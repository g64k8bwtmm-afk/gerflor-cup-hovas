<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <style>
      .wing-red { fill: #DC143C; stroke: #000; stroke-width: 1.5; }
      .wing-blue { fill: #001A4D; stroke: none; }
      .body-red { fill: #DC143C; stroke: #000; stroke-width: 2; }
      .head-white { fill: white; stroke: #000; stroke-width: 2; }
      .circle { fill: white; stroke: #000; stroke-width: 2.5; }
      .text-hovaa { font-family: Arial, sans-serif; font-size: 56px; font-weight: bold; fill: #001A4D; text-anchor: middle; letter-spacing: 4px; }
      .text-hc { font-family: Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #001A4D; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Bottom circle -->
  <circle cx="200" cy="190" r="160" class="circle"/>
  
  <!-- LEFT WING - Outer red feathers -->
  <path d="M 90 160 Q 40 135 10 115 Q -5 105 5 120 Q 45 145 90 170" class="wing-red"/>
  <path d="M 85 180 Q 35 160 8 145 Q -8 138 5 155 Q 50 180 85 195" class="wing-red"/>
  <path d="M 88 200 Q 38 182 10 170 Q -8 165 5 180 Q 50 200 88 215" class="wing-red"/>
  <path d="M 92 220 Q 42 205 15 195 Q -5 190 8 205 Q 55 220 92 235" class="wing-red"/>
  
  <!-- LEFT WING - Inner blue stripes -->
  <path d="M 100 168 Q 60 150 35 138 Q 25 135 32 148 Q 65 165 100 180" class="wing-blue"/>
  <path d="M 100 188 Q 60 170 35 158 Q 25 155 32 168 Q 65 185 100 200" class="wing-blue"/>
  <path d="M 100 208 Q 60 190 35 178 Q 25 175 32 188 Q 65 205 100 220" class="wing-blue"/>
  
  <!-- RIGHT WING - Outer red feathers -->
  <path d="M 310 160 Q 360 135 390 115 Q 405 105 395 120 Q 355 145 310 170" class="wing-red"/>
  <path d="M 315 180 Q 365 160 392 145 Q 408 138 395 155 Q 350 180 315 195" class="wing-red"/>
  <path d="M 312 200 Q 362 182 390 170 Q 408 165 395 180 Q 350 200 312 215" class="wing-red"/>
  <path d="M 308 220 Q 358 205 385 195 Q 405 190 392 205 Q 345 220 308 235" class="wing-red"/>
  
  <!-- RIGHT WING - Inner blue stripes -->
  <path d="M 300 168 Q 340 150 365 138 Q 375 135 368 148 Q 335 165 300 180" class="wing-blue"/>
  <path d="M 300 188 Q 340 170 365 158 Q 375 155 368 168 Q 335 185 300 200" class="wing-blue"/>
  <path d="M 300 208 Q 340 190 365 178 Q 375 175 368 188 Q 335 205 300 220" class="wing-blue"/>
  
  <!-- Eagle body (red) -->
  <ellipse cx="200" cy="140" rx="32" ry="42" class="body-red"/>
  
  <!-- Eagle head (white) -->
  <circle cx="200" cy="100" r="14" class="head-white"/>
  <circle cx="205" cy="98" r="4" fill="#000"/>
  
  <!-- Beak -->
  <path d="M 208 100 L 220 98 L 208 102 Z" fill="#000"/>
  
  <!-- Text HOVÅS -->
  <text x="200" y="155" class="text-hovaa">HOVÅS</text>
  
  <!-- Text HC -->
  <text x="200" y="330" class="text-hc">HC</text>
</svg>