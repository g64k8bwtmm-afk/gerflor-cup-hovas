  <path d="M 130 100 Q 135 85 140 75 Q 142 70 145 75 Q 140 85 135 95" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  <path d="M 135 95 Q 140 90 145 80 Q 147 75 150 82 Q 145 92 140 100" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  <path d="M 140 100 Q 145 95 150 85 Q 152 80 155 88 Q 150 98 145 105" fill="#dc143c" stroke="#001a4d" stroke-width="1.5"/>
  
  <!-- Text "HOVÅS" -->
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#001a4d" text-anchor="middle" letter-spacing="2">HOVÅS</text>
  
  <!-- Text "HC" -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#001a4d" text-anchor="middle">HC</text>
</svg>